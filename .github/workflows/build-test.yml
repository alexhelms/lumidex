name: Build and Test

on:
  push:
    branches: [main, 'support/**']
    pull_request:
      branches: [main]
      
  permissions:
    contents: read

env:
  SOLUTION: Lumidex.slnx
  PROJECT: Lumidex/Lumidex.csproj
 
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]  # FUTURE: add ubuntu-24.04-arm, windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Restore Tools
        run: dotnet tool restore
        
      - name: Enable Automated Test Report Artifact Upload
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Show Version
        run: dotnet tool run dotnet-gitversion /output

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build
        env:
          TUNIT_ARTIFACT_RETENTION_DAYS: 5
