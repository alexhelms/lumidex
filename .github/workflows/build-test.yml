name: Build and Test

on:
  push:
    branches: [main, 'support/**']
    pull_request:
      branches: [main]
      
permissions:
  contents: read

jobs:
  build-test:
    name: Build And Test
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]  # FUTURE: add ubuntu-24.04-arm, windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:

      - uses: actions/checkout@v7
        with:
          # No need for full depth for just testing, version will be wrong but that's fine.
          lfs: true

      - name: Restore Tools
        run: dotnet tool restore
        
      - name: Enable Automated Test Report Artifact Upload
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Restore
        run: dotnet restore Lumidex.slnx

      - name: Build
        run: dotnet build Lumidex.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Lumidex.slnx -c Release --no-build
        env:
          TUNIT_ARTIFACT_RETENTION_DAYS: 5
